<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Solicitudes | InformaticaVES</title>
  <meta name="description" content="Consulta el estado de tus solicitudes de soporte técnico con El Técnico Luis.">
  <meta name="theme-color" content="#63b3ed">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Mis Solicitudes Styles ── */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      max-width: 520px;
      margin: 0 auto 2rem;
    }
    .search-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .search-card p {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }
    .search-row {
      display: flex;
      gap: 0.5rem;
    }
    .search-row .form-input {
      flex: 1;
    }
    /* Estado badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .status-pendiente  { background: rgba(246,224,94,0.15);  color: #f6e05e;  border: 1px solid rgba(246,224,94,0.3);  }
    .status-tomado     { background: rgba(99,179,237,0.15);  color: #63b3ed;  border: 1px solid rgba(99,179,237,0.3);  }
    .status-en_progreso{ background: rgba(168,85,247,0.15);  color: #a855f7;  border: 1px solid rgba(168,85,247,0.3);  }
    .status-finalizado { background: rgba(104,211,145,0.15); color: #68d391;  border: 1px solid rgba(104,211,145,0.3); }
    /* Timeline de estados */
    .timeline {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 1rem 0;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .tl-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
      position: relative;
    }
    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      z-index: 1;
      transition: all 0.3s;
    }
    .tl-dot.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      box-shadow: 0 0 0 4px rgba(99,179,237,0.2);
    }
    .tl-dot.done {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }
    .tl-label {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      text-align: center;
      line-height: 1.2;
    }
    .tl-label.active { color: var(--blue); font-weight: 700; }
    .tl-label.done   { color: var(--green); }
    .tl-line {
      flex: 1;
      height: 2px;
      background: var(--border);
      min-width: 24px;
    }
    .tl-line.done { background: var(--green); }
    /* Solicitud card */
    .solicitud-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .solicitud-card:hover { border-color: rgba(99,179,237,0.4); }
    .solicitud-card.urgente { border-left: 3px solid var(--red); }
    .solicitud-card.media   { border-left: 3px solid #f6e05e; }
    .solicitud-card.baja    { border-left: 3px solid var(--green); }
    .sol-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .sol-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .sol-fecha {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .sol-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .sol-detail span strong { color: var(--text); }
    .valorar-btn {
      margin-top: 0.75rem;
      width: 100%;
    }
    /* Modal valoración */
    .stars {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
    }
    .star-btn {
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.15s, transform 0.15s;
    }
    .star-btn.active, .star-btn:hover { opacity: 1; transform: scale(1.2); }
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state h3 { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .empty-state p  { font-size: 0.82rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo" style="text-decoration:none;">
      <img src="logo_oficial.png" alt="InformaticaVES" style="height:110px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(255,255,255,0.2));">
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="solicitud.html">Solicitar</a></li>
      <li><a href="mis-solicitudes.html" class="active">Mis Solicitudes</a></li>
      <li><a href="admin.html" id="nav-admin" class="hidden">Administrador</a></li>
    </ul>
    <div class="nav-actions">
      <span class="admin-badge hidden" id="admin-badge">Administrador</span>
      <div class="user-avatar hidden" id="user-avatar"></div>
      <button class="btn-nav-auth" id="btn-login">Iniciar Sesión</button>
    </div>
  </div>
</nav>

<main class="container" style="padding-top:2rem;padding-bottom:3rem;max-width:700px;">

  <!-- Header -->
  <div style="text-align:center;margin-bottom:1.5rem;position:relative;">
    <div style="font-size:2.5rem;margin-bottom:0.5rem;">📋</div>
    <h1 style="font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:0.4rem;">Mis Solicitudes</h1>
    <p style="color:var(--text-dim);font-size:0.9rem;">Consulta el estado de tus solicitudes en tiempo real</p>
    <button id="btn-cambiar-pass" class="btn btn-sm hidden" style="background:var(--blue); color:white; border:none; margin-top:1rem;">🔑 Cambiar Contraseña</button>
  </div>

  <!-- Buscar por WhatsApp (solo para usuarios no logueados) -->
  <div class="search-card" id="search-section">
    <h2>🔍 Buscar solicitudes</h2>
    <p>Ingresa el número de WhatsApp con el que enviaste la solicitud</p>
    <div class="search-row">
      <input type="tel" id="input-buscar-wa" class="form-input" placeholder="+58 424-000-0000" autocomplete="tel">
      <button id="btn-buscar" class="btn btn-primary">Buscar</button>
    </div>
    <div id="buscar-error" style="color:var(--red);font-size:0.8rem;margin-top:0.5rem;display:none;"></div>
  </div>

  <!-- Resultado -->
  <div id="resultado-container"></div>

</main>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Modal de Valoración -->
<div class="modal-backdrop hidden" id="modal-valoracion">
  <div class="modal-box" style="max-width:400px;">
    <button class="modal-close" id="cerrar-valoracion">✕</button>
    <div style="text-align:center;margin-bottom:1rem;">
      <div style="font-size:2rem;margin-bottom:0.5rem;">⭐</div>
      <h2 class="modal-title">Califica el servicio</h2>
      <p class="modal-desc" id="valoracion-servicio-nombre"></p>
    </div>
    <div class="stars" id="estrellas-container">
      <button class="star-btn" data-val="1">⭐</button>
      <button class="star-btn" data-val="2">⭐</button>
      <button class="star-btn" data-val="3">⭐</button>
      <button class="star-btn" data-val="4">⭐</button>
      <button class="star-btn" data-val="5">⭐</button>
    </div>
    <div class="form-group">
      <label class="form-label" for="valoracion-comentario">Comentario</label>
      <div style="margin-top:1.5rem;">
      <textarea id="valoracion-comentario" class="form-input" placeholder="Opcional: Deja un comentario (ej: muy rápido, excelente trato...)" rows="3"></textarea>
    </div>
    <button class="btn btn-primary valorar-btn" id="enviar-valoracion">Enviar Valoración</button>
  </div>
</div>

<!-- Modal de Cambiar Contraseña -->
<div class="modal-backdrop hidden" id="modal-cambiar-pass">
  <div class="modal-box" style="max-width:400px;text-align:left">
    <button class="modal-close" onclick="document.getElementById('modal-cambiar-pass').classList.add('hidden')">✕</button>
    <h2 class="modal-title mb-2">🔑 Cambiar Contraseña</h2>
    
    <div class="form-group">
      <label class="form-label">Nueva contraseña</label>
      <input type="password" id="cp-nueva" class="form-input" placeholder="Tu nueva contraseña segura">
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar contraseña</label>
      <input type="password" id="cp-conf" class="form-input" placeholder="Repite la contraseña">
    </div>
    <div id="cp-error" style="color:var(--red);font-size:0.85rem;margin-bottom:1rem;display:none;"></div>
    <button class="btn btn-primary w-full" id="btn-guardar-cp">Guardar Contraseña</button>
  </div>
</div>

<script type="module">
  import { 
    db, getDocs, collection, query, where, doc, updateDoc, 
    serverTimestamp, addDoc, COLS, getSolicitudesByWhatsApp, guardarValoracion, getValoracionBySolicitud
  } from './firebase.js';
  import * as Auth from './auth.js';
  import { onAuthChange, isAdmin } from './auth.js';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.warn);
  }

  // ── Auth UI ──────────────────────────────────────────
  document.getElementById('btn-login')?.addEventListener('click', () => Auth.openAuthModal());
  // El avatar ahora es manejado por auth.js (openProfileDropdown)

  const btnCambiarPassGlobal = document.getElementById('btn-cambiar-pass');
  onAuthChange(user => {
    const navAdmin = document.getElementById('nav-admin');
    const badge    = document.getElementById('admin-badge');
    const avatar   = document.getElementById('user-avatar');
    const btnLogin = document.getElementById('btn-login');
    const searchSection = document.getElementById('search-section');
    if (user) {
      btnLogin?.classList.add('hidden');
      avatar?.classList.remove('hidden');
      if (btnCambiarPassGlobal) btnCambiarPassGlobal.classList.remove('hidden');
      const nombre = Auth.userNombre || user.displayName || user.email || 'U';
      avatar.textContent = nombre.charAt(0).toUpperCase();
      if (Auth.isAdmin) {
        navAdmin?.classList.remove('hidden');
        badge?.classList.remove('hidden');
      }
      // Si está logueado: ocultar buscador y cargar solicitudes automáticamente
      const wa = Auth.getWhatsApp();
      if (wa) {
        if (searchSection) searchSection.style.display = 'none';
        const inputWa = document.getElementById('input-buscar-wa');
        if (inputWa) inputWa.value = wa;
        // Esperar un tick para que buscarSolicitudes esté definida
        setTimeout(() => buscarSolicitudes(), 0);
      } else {
        // No tiene WhatsApp en Auth → mostrar buscador
        if (searchSection) searchSection.style.display = '';
      }
    } else {
      btnLogin?.classList.remove('hidden');
      avatar?.classList.add('hidden');
      if (searchSection) searchSection.style.display = '';
    }
  });

  // ── Estados helpers ────────────────────────────────────────
  const ESTADOS = [
    { key: 'pendiente',   label: 'Pendiente',    emoji: '📬' },
    { key: 'tomado',      label: 'Tomado',        emoji: '📋' },
    { key: 'en_progreso', label: 'En Progreso',   emoji: '▶️' },
    { key: 'finalizado',  label: 'Finalizado',    emoji: '✅' },
  ];

  const ESTADO_IDX = { pendiente: 0, tomado: 1, en_progreso: 2, finalizado: 3 };

  function badgeEstado(estado) {
    if (estado === 'cancelado') {
      return `<span class="status-badge" style="background:#fed7d7;color:#9b2c2c;border:1px solid #fc8181">❌ Cancelado</span>`;
    }
    const e = ESTADOS.find(x => x.key === estado) || ESTADOS[0];
    return `<span class="status-badge status-${estado}">${e.emoji} ${e.label}</span>`;
  }

  function timeline(estadoActual) {
    if (estadoActual === 'cancelado') {
      return `<div style="text-align:center; padding:1.5rem 1rem; color:var(--red); font-weight:600; background:#fff5f5; border-radius:0.75rem; margin:1.5rem 0;">
        🚫 Esta solicitud ha sido cancelada.
      </div>`;
    }
    const idx = ESTADO_IDX[estadoActual] ?? 0;
    let html = '';
    ESTADOS.forEach((e, i) => {
      const isDone   = i < idx;
      const isActive = i === idx;
      const dotClass = isDone ? 'done' : isActive ? 'active' : '';
      const lblClass = isDone ? 'done' : isActive ? 'active' : '';
      if (i > 0) html += `<div class="tl-line ${isDone ? 'done' : ''}"></div>`;
      html += `
        <div class="tl-step">
          <div class="tl-dot ${dotClass}">${isDone ? '✓' : e.emoji}</div>
          <div class="tl-label ${lblClass}">${e.label}</div>
        </div>`;
    });
    return `<div class="timeline">${html}</div>`;
  }

  // ── Buscar solicitudes ─────────────────────────────────────
  let unsubscribe = null;
  let solicitudesCargadas = [];

  function normalizeWA(num) {
    return num.replace(/\s|-|\(|\)/g, '');
  }

  // Modal Cambiar Contraseña
  const btnCambiarPass = document.getElementById('btn-cambiar-pass');
  const modalCp = document.getElementById('modal-cambiar-pass');
  const btnGuardarCp = document.getElementById('btn-guardar-cp');
  const errCp = document.getElementById('cp-error');
  
  if (btnCambiarPass) {
    btnCambiarPass.addEventListener('click', () => {
      document.getElementById('cp-nueva').value = '';
      document.getElementById('cp-conf').value = '';
      errCp.style.display = 'none';
      modalCp.classList.remove('hidden');
    });
  }

  if (btnGuardarCp) {
    btnGuardarCp.addEventListener('click', async () => {
      const p1 = document.getElementById('cp-nueva').value;
      const p2 = document.getElementById('cp-conf').value;
      
      const hasLetters = (p1.match(/[a-zA-Z]/g) || []).length >= 4;
      const hasUpper = (p1.match(/[A-Z]/g) || []).length >= 1;
      const hasNumbers = (p1.match(/[0-9]/g) || []).length >= 4;

      if (!hasLetters || !hasUpper || !hasNumbers) {
        errCp.textContent = 'La contraseña debe tener mínimo 4 letras, 1 mayúscula y 4 números.';
        errCp.style.display = 'block';
        return;
      }
      if (p1 !== p2) {
        errCp.textContent = 'Las contraseñas no coinciden.';
        errCp.style.display = 'block';
        return;
      }
      
      try {
        btnGuardarCp.disabled = true;
        btnGuardarCp.textContent = 'Guardando...';
        await Auth.changeUserPassword(p1);
        modalCp.classList.add('hidden');
        mostrarToast('✅ Contraseña cambiada con éxito', 'success');
      } catch (err) {
        let msg = err.message;
        if (msg.includes('requires-recent-login')) {
          msg = 'Por seguridad, debes cerrar sesión e ingresar nuevamente antes de cambiar la contraseña.';
        }
        errCp.textContent = msg;
        errCp.style.display = 'block';
      } finally {
        btnGuardarCp.disabled = false;
        btnGuardarCp.textContent = 'Guardar Contraseña';
      }
    });
  }

  async function buscarSolicitudes() {
    const wa = normalizeWA(document.getElementById('input-buscar-wa').value.trim());
    const errEl = document.getElementById('buscar-error');
    const container = document.getElementById('resultado-container');

    errEl.style.display = 'none';

    if (!wa || wa.length < 7) {
      errEl.textContent = 'Por favor ingresa un número válido.';
      errEl.style.display = 'block';
      return;
    }

    // Guardar para la próxima vez
    localStorage.setItem('ives_wa', wa);

    // Mostrar loader
    container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text-dim)"><span class="spinner"></span> Buscando solicitudes...</div>`;

    // Cancelar listener anterior
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }

    try {
      // Escuchar EN TIEMPO REAL las solicitudes de este WhatsApp
      const q = query(
        collection(db, COLS.solicitudes),
        where('whatsapp', '==', wa)
      );

      unsubscribe = onSnapshot(q, async snap => {
        const lista = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

        // Detectar cambios de estado para notificar
        if (solicitudesCargadas.length > 0) {
          lista.forEach(nueva => {
            const anterior = solicitudesCargadas.find(v => v.id === nueva.id);
            if (anterior && anterior.estadoCaso !== nueva.estadoCaso) {
              mostrarToast(`🔔 Tu caso "${nueva.servicio}" cambió a: ${nueva.estadoCaso?.replace('_',' ').toUpperCase()}`, 'success');
              // Notificación nativa en APK con canal de alta prioridad
              if (window.Capacitor?.Plugins?.LocalNotifications) {
                window.Capacitor.Plugins.LocalNotifications.schedule({
                  notifications: [{
                    title: '📋 Actualización de tu caso',
                    body: `${nueva.servicio} → ${nueva.estadoCaso?.replace('_', ' ').toUpperCase()}`,
                    id: Math.floor(Math.random() * 2000000000),
                    channelId: 'ives_solicitudes_high',
                    sound: 'default',
                    actionTypeId: '',
                    extra: null
                  }]
                }).catch(console.warn);
              }
            }
          });
        }
        solicitudesCargadas = lista;

        if (!lista.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="icon">🤷</div>
              <h3>Sin solicitudes encontradas</h3>
              <p>No encontramos solicitudes para el número <strong>${wa}</strong>.<br>Verifica el número o <a href="solicitud.html" style="color:var(--blue)">envía una solicitud</a>.</p>
            </div>`;
          return;
        }

        // Renderizar cards
        let html = `<p style="color:var(--text-dim);font-size:0.8rem;margin-bottom:1rem;">
          Se encontraron <strong style="color:var(--text)">${lista.length}</strong> solicitudes — actualización en tiempo real 🟢
        </p>`;

        for (const s of lista) {
          const urgClass = s.urgencia === 'alta' ? 'urgente' : s.urgencia === 'media' ? 'media' : 'baja';
          const urgEmoji = s.urgencia === 'alta' ? '🔴' : s.urgencia === 'media' ? '🟡' : '🟢';
          const estado   = s.estadoCaso || 'pendiente';
          const fecha    = s.timestamp?.toDate?.()?.toLocaleString('es-VE', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          }) || '—';

          // Check if already rated
          const valoracion = await getValoracionBySolicitud(s.id);
          const yaValorado = !!valoracion;

          html += `
            <div class="solicitud-card ${urgClass}" id="card-${s.id}">
              <div class="sol-header">
                <div>
                  <div class="sol-title">${urgEmoji} ${s.servicio || '—'}</div>
                  <div style="margin-top:0.3rem;">${badgeEstado(estado)}</div>
                </div>
                <div class="sol-fecha">${fecha}</div>
              </div>

              ${timeline(estado)}

              <div class="sol-detail">
                <span><strong>Cliente:</strong> ${s.nombre}</span>
                <span><strong>WhatsApp:</strong> ${s.whatsapp}</span>
                <span><strong>Urgencia:</strong> ${urgEmoji} ${s.urgenciaLabel || s.urgencia}</span>
                <span><strong>Precio base:</strong> $${s.precio} ${s.moneda}</span>
                ${s.direccion ? `<span style="grid-column:1/-1"><strong>Dirección:</strong> ${s.direccion}</span>` : ''}
                ${s.descripcion && s.descripcion !== '—' ? `<span style="grid-column:1/-1"><strong>Descripción:</strong> ${s.descripcion}</span>` : ''}
              </div>

              ${estado === 'finalizado' ? `
                ${yaValorado
                  ? `<div style="text-align:center;color:var(--green);font-size:0.82rem;">⭐ Ya valoraste este servicio — ¡Gracias!</div>`
                  : `<button class="btn btn-primary valorar-btn" data-id="${s.id}" data-servicio="${s.servicio}">⭐ Valorar este servicio</button>`
                }
                <a href="https://wa.me/584242964339?text=${encodeURIComponent(`Hola Luis, mi solicitud de ${s.servicio} ya fue finalizada. ¡Gracias!`)}"
                   class="btn btn-secondary w-full" target="_blank" style="margin-top:0.5rem;">
                  💬 Contactar por WhatsApp
                </a>
              ` : `
                <a href="https://wa.me/584242964339?text=${encodeURIComponent(`Hola Luis, quiero consultar el estado de mi solicitud de ${s.servicio}.`)}"
                   class="btn btn-secondary w-full" target="_blank">
                  💬 Consultar por WhatsApp
                </a>
              `}
            </div>`;
        }

        container.innerHTML = html;

        // Listeners para valorar
        document.querySelectorAll('.valorar-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            abrirModalValoracion(btn.dataset.id, btn.dataset.servicio);
          });
        });
      });

    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error al buscar</h3><p>${err.message}</p></div>`;
    }
  }

  document.getElementById('btn-buscar').addEventListener('click', buscarSolicitudes);
  document.getElementById('input-buscar-wa').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscarSolicitudes();
  });

  // Si hay wa guardado, buscar automático
  const waGuardado = localStorage.getItem('ives_wa');
  if (waGuardado) {
    document.getElementById('input-buscar-wa').value = waGuardado;
    buscarSolicitudes();
  }

  // ── Toast ────────────────────────────────────────────────
  function mostrarToast(msg, tipo = 'success') {
    const tc = document.getElementById('toast-container');
    const t  = document.createElement('div');
    t.className = `toast toast-${tipo}`;
    t.textContent = msg;
    tc.appendChild(t);
    setTimeout(() => t.classList.add('visible'), 50);
    setTimeout(() => { t.classList.remove('visible'); setTimeout(() => t.remove(), 400); }, 4000);
  }

  // ── Modal valoración ──────────────────────────────────────
  let valoracionSolicitudId   = null;
  let valoracionServicioNombre = null;
  let estrellasSeleccionadas  = 0;

  function abrirModalValoracion(id, servicio) {
    valoracionSolicitudId    = id;
    valoracionServicioNombre = servicio;
    estrellasSeleccionadas   = 0;
    document.getElementById('valoracion-servicio-nombre').textContent = servicio;
    document.getElementById('valoracion-comentario').value = '';
    document.getElementById('btn-enviar-valoracion').disabled = true;
    document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('modal-valoracion').classList.remove('hidden');
  }

  document.getElementById('cerrar-valoracion').addEventListener('click', () => {
    document.getElementById('modal-valoracion').classList.add('hidden');
  });

  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      estrellasSeleccionadas = parseInt(btn.dataset.val);
      document.querySelectorAll('.star-btn').forEach((b, i) => {
        b.classList.toggle('active', i < estrellasSeleccionadas);
      });
      document.getElementById('btn-enviar-valoracion').disabled = false;
    });
  });

  document.getElementById('btn-enviar-valoracion').addEventListener('click', async () => {
    if (!estrellasSeleccionadas) return;
    const btnEnv = document.getElementById('btn-enviar-valoracion');
    btnEnv.disabled = true;
    btnEnv.textContent = 'Enviando...';
    try {
      await guardarValoracion({
        solicitudId: valoracionSolicitudId,
        servicio:    valoracionServicioNombre,
        estrellas:   estrellasSeleccionadas,
        comentario:  document.getElementById('valoracion-comentario').value.trim(),
        whatsapp:    normalizeWA(document.getElementById('input-buscar-wa').value.trim()),
      });
      document.getElementById('modal-valoracion').classList.add('hidden');
      mostrarToast('⭐ ¡Gracias por tu valoración!', 'success');
      buscarSolicitudes(); // Refrescar para mostrar "ya valorado"
    } catch (err) {
      mostrarToast('Error al enviar valoración. Intenta de nuevo.', 'error');
      btnEnv.disabled = false;
      btnEnv.textContent = 'Enviar Valoración';
    }
  });
</script>

</body>
</html>
